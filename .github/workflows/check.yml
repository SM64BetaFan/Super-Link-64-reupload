name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Cycl0o0/liboot
          ref: 8a98fcd124465b9d59623956a0d08c3ec7c30fcf
          path: liboot
      - name: Install Lua syntax checker
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check source tree
        run: make check LIBOOT_SOURCE="$GITHUB_WORKSPACE/liboot"
